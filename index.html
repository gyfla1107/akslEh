<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마니또 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .login-section {
            text-align: center;
        }

        .password-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .password-input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .result-section {
            display: none;
            text-align: center;
        }

        .result-section.active {
            display: block;
        }

        .welcome {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
        }

        .manitto-reveal {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .manitto-label {
            color: #666;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .manitto-name {
            font-size: 2.5em;
            font-weight: bold;
            color: #764ba2;
            margin: 10px 0;
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .logout-btn {
            background: #6c757d;
            margin-top: 20px;
        }

        .instruction {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.85em;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> 마니또 게임</h1>
        <p class="subtitle">비밀번호를 입력하여 마니또를 확인하세요</p>

        <div class="login-section" id="loginSection">
            <input 
                type="password" 
                class="password-input" 
                id="passwordInput" 
                placeholder="비밀번호 입력"
                onkeypress="if(event.key==='Enter') checkPassword()"
            >
            <button onclick="checkPassword()">확인</button>
            <p class="error" id="errorMsg"></p>
            
            <div class="instruction">
                <strong>안내사항</strong><br>
                각자에게 전달받은 비밀번호로 로그인하여 마니또를 확인하세요!
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <p class="welcome" id="welcomeMsg"></p>
            <div class="manitto-reveal">
                <p class="manitto-label">당신의 마니또는</p>
                <p class="manitto-name" id="manittoName"></p>
            </div>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
    </div>

    <script>
        // ========================================
        // BACKEND: 데이터 관리
        // ========================================

        // 참가자 이름 설정 (10명)
       const PARTICIPANTS = [
  '효림',
  '혜교',
  '예은',
  '혜원',
  '다빈',
  '윤주',
  '맹지',
  '민경',
  '수민',
  '수현',
  '혜민'
];


        // 여기에 생성된 데이터를 붙여넣으세요
        const GAME_DATA = {
  "PAT97Q": { "person": "효림", "manitto": "예은" },
  "2HNE5S": { "person": "혜교", "manitto": "수민" },
  "KAG5QE": { "person": "예은", "manitto": "혜원" },
  "CDSUZJ": { "person": "혜원", "manitto": "맹지" },
  "HCW8VT": { "person": "다빈", "manitto": "혜교" },
  "ZMDLNJ": { "person": "윤주", "manitto": "다빈" },
  "AMCGUP": { "person": "맹지", "manitto": "수현" },
  "M8TYW6": { "person": "민경", "manitto": "윤주" },
  "TPS6YJ": { "person": "수민", "manitto": "혜민" },
  "8C3FHU": { "person": "수현", "manitto": "효림" },
  "MPZKVH": { "person": "혜민", "manitto": "민경" }
};


        // API 함수
        function getManittoByPassword(password) {
            return GAME_DATA[password] || null;
        }

        // 초기 데이터 생성 헬퍼
        function generateInitialData() {
            function generateRandomPassword() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let password = '';
                for (let i = 0; i < 6; i++) {
                    password += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return password;
            }

            function assignManitto(names) {
                let assignments;
                let isValid = false;
                let attempts = 0;

                while (!isValid && attempts < 1000) {
                    const shuffled = [...names].sort(() => Math.random() - 0.5);
                    assignments = names.map((name, idx) => ({
                        person: name,
                        manitto: shuffled[idx]
                    }));
                    isValid = assignments.every(a => a.person !== a.manitto);
                    attempts++;
                }
                return assignments;
            }

            const assignments = assignManitto(PARTICIPANTS);
            const usedPasswords = new Set();
            const result = {};

            assignments.forEach(assignment => {
                let password;
                do {
                    password = generateRandomPassword();
                } while (usedPasswords.has(password));
                
                usedPasswords.add(password);
                result[password] = {
                    person: assignment.person,
                    manitto: assignment.manitto
                };
            });

            //console.log('=== 1단계: 아래 코드를 복사하여 GAME_DATA를 교체하세요 ===\n');
            //console.log(`const GAME_DATA = ${JSON.stringify(result, null, 2)};`);
            console.log('\n=== 2단계: 각 참가자에게 비밀번호를 개별 전달하세요 ===');
            Object.keys(result).forEach(password => {
                console.log(`${result[password].person}: ${password}`);  // 여기 수정!
            });
            //console.log('\n=== 3단계: generateInitialData() 호출을 주석 처리하세요 ===');
        }

        // 주석을 해제하고 한 번만 실행하여 데이터 생성
         //generateInitialData();

        // ========================================
        // FRONTEND: UI 로직
        // ========================================

        function checkPassword() {
            const password = document.getElementById('passwordInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            if (!password) {
                errorMsg.textContent = '비밀번호를 입력하세요!';
                return;
            }

            const data = getManittoByPassword(password);
            
            if (data) {
                showResult(data);
                errorMsg.textContent = '';
                document.getElementById('passwordInput').value = '';
            } else {
                errorMsg.textContent = '잘못된 비밀번호입니다!';
            }
        }

        function showResult(data) {
            document.getElementById('welcomeMsg').textContent = `${data.person}님, 환영합니다! 👋`;
            document.getElementById('manittoName').textContent = data.manitto;
            
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('resultSection').classList.add('active');
        }

        function logout() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('errorMsg').textContent = '';
        }
    </script>
</body>
</html>
